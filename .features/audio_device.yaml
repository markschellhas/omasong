feature_name: audio_device
purpose: "Play through PipeWire on the host. The sink command is vendored drywet; the paced writer stays in the adapter."

entry_points:
  - play-notes.py
  - drywet/sink.py
  - Songwriter.qml

apps:
  - songwriter

user_flow:
  primary: "Play/preview/live → play-notes.py --engine → drywet PipeWireSink pw-cat raw s16 44100 mono; adapter adds --latency 80ms"
  warmup: "Overlay open → warmup loads the active bank through drywet.Sampler and starts the silence clock"

related_features:
  - playback (engine output)
  - instruments (Piano, Electric Piano, Organ samples)
  - beats (synthesized percussion measure output)

core_components:
  - drywet/sink.py
  - drywet/instrument.py
  - tests/run.py
  - samples/piano
  - samples/epiano
  - samples/organ

notes: "drywet/ is vendored (drywet/UPSTREAM); plugin install does not pip install it. Song JSON, instrument index 0–2, and note-on voices stay in play-notes.py. Paced stdin writer stays there: drywet PipeWireSink writes a block and closes on stop, which restarts pw-cat. Adapter appends --latency 80ms because drywet's argv omits it (pw-cat default 100ms underruns the 20ms writer). Sample cache lives across bars. pw-play is not the transport path."
