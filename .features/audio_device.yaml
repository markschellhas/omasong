feature_name: audio_device
purpose: "Play through PipeWire on the host."

entry_points:
  - play-notes.py
  - Songwriter.qml

apps:
  - songwriter

user_flow:
  primary: "Play, preview, or live note → play-notes.py → pw-play / paplay / aplay"

related_features:
  - playback (engine output)
  - instruments (Piano samples; other timbres are sines)

core_components:
  - tests/run.py
  - samples/piano

notes: "Persist instrument prefs next to song state. play-notes caps duration, pitch, and voice count. Piano mixes samples/piano; other timbres synthesize. PipeWire and omarchy plugin validate are not in CI."
