feature_name: audio_device
purpose: "Play through PipeWire on the host."

entry_points:
  - play-notes.py
  - Songwriter.qml

apps:
  - songwriter

user_flow:
  primary: "Play/preview/live → play-notes.py --engine → pw-cat raw s16 44100 mono latency 80ms stdin -"

related_features:
  - playback (engine output)
  - instruments (Piano, Electric Piano, Organ samples)
  - beats (synthesized percussion measure output)

core_components:
  - tests/run.py
  - samples/piano
  - samples/epiano
  - samples/organ

notes: "Persist instrument prefs next to song state. play-notes caps duration, pitch, and voice count. Piano, Electric Piano, and Organ mix sample banks. Persistent process; sample cache lives across bars; pw-play is not the transport path. PipeWire and omarchy plugin validate are not in CI."
