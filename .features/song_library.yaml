feature_name: song_library
purpose: "Save each arrangement as its own JSON file and load one from the projects directory."

entry_points:
  - Transport.qml
  - Songwriter.qml
  - song-library
  - js/Song.js
  - write-json.py

apps:
  - songwriter

user_flow:
  title: "User → edit name field → song.title; autosave session song.json"
  new: "User → New → empty Untitled session with blank id; stop playback; persist session"
  save: "User → name + Save → write-json stage → song-library save → ~/.local/share/songwriter/projects/<name>.json; rename file if loaded title changed"
  open: "User → Open → list every *.json in projects/ → click loads that file; stop playback"
  rename: "User → loaded project → change name field → Save → rename that JSON file"
  error: "User → invalid/missing project file → helper exits 2; UI shows status"

related_features:
  - song_structure (document body is sections/measures)
  - playback (BPM/loop ride with loaded song; stop on load)
  - agent_api (session snapshots still from current song)
  - instruments (prefs fields travel with saved document)
  - beats (patterns and beatsVisible travel with saved document)

core_components:
  - tests/run.py
  - tests/js_tests.js

notes: "One JSON file per project in XDG_DATA_HOME/songwriter/projects (else ~/.local/share/songwriter/projects). Session autosave stays ~/.local/state/omarchy/songwriter/song.json. Open always re-lists the directory. Old library.json is migrated once to per-file projects. Staging is write-json.py then song-library save."
