feature_name: region_focus
purpose: "j/k and up/down cycle focus among circle, song structure, and keyboard; h/l and left/right act only on the highlighted region."

entry_points:
  - Songwriter.qml
  - js/Focus.js

apps:
  - songwriter

user_flow:
  primary: "User → j/k or up/down → cycleNavRegion; focus frame and hint text update"
  horizontal: "User → h/l or left/right → Circle rotates key; Keyboard cycles instrument; Song ignores"
  song_cells: "User → Tab or Shift+Tab with Song structure highlighted → move the selected cell"
  degrees: "User → 1–7 with Circle focused and laptop keys off → previewChip"

related_features:
  - circle_of_fifths (rotate; 1–7 preview)
  - instruments (cycle sound)
  - laptop_keys (steals hjkl when on)
  - song_structure (Song region)
  - piano_keyboard (Keyboard region)

core_components:
  - CircleOfFifths.qml
  - Piano.qml
  - SongStructure.qml

notes: "Regions top→bottom: Circle, Song, Keyboard. Horizontal navigation is scoped to the highlighted region; overlay focus frames are not in CI."
