feature_name: piano_keyboard
purpose: "Show a C3–C5 piano; click keys to play notes; light triad notes from play, preview, or selection."

entry_points:
  - Piano.qml
  - Songwriter.qml

apps:
  - songwriter

user_flow:
  primary: "User → mouse down on key → noteOn MIDI → play-notes.py"
  highlight: "Playback, preview, or selected slot triad → highlighted MIDI 48–72"

related_features:
  - playback (sounding notes, live notes)
  - instruments (SoundPicker chevrons)
  - laptop_keys (computer-keyboard toggle)
  - circle_of_fifths (preview highlight)
  - region_focus (Keyboard region)
  - guitar_tab (right column; piano stays C3–C5, narrower)

core_components:
  - js/Keyboard.js
  - play-notes.py

notes: "Range is C3–C5 inclusive, not a sliding two-octave window from C4."
