feature_name: laptop_keys
purpose: "Optional QWERTY map (A=C …; Z/X octave) that plays live notes and steals H/J/K/L from vim nav."

entry_points:
  - js/Keyboard.js
  - Piano.qml
  - Songwriter.qml

apps:
  - songwriter

user_flow:
  primary: "User → glyph toggle on → A/W/S… map to MIDI"
  octave: "User → Z/X → shiftOctave (0–8)"
  alt: "Mapping off → j/k/h/l remain region nav"

related_features:
  - piano_keyboard (toggle and key glyphs)
  - playback (live notes)
  - region_focus (mapping takes over H/J/K/L)

core_components:
  - tests/js_tests.js

notes: "Off by default. Space is not sustain."
