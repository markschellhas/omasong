feature_name: playback
purpose: "Play, stop, and loop the song at BPM; audition a slot; drive playhead and sounding-note highlight."

entry_points:
  - Transport.qml
  - Songwriter.qml
  - js/Song.js

apps:
  - songwriter

user_flow:
  primary: "User → Play or Space → queue measureLaunchEvents on audio engine; playhead follows wall clock from started+latency"
  section: "User → section Play → buildSectionTimeline for that section only"
  loop: "User → Loop toggle → wrap currentBeat"
  bpm: "User → BPM 40–240 → Song.setBpm"
  audition: "User → click filled slot → engine play-midi for slotDurationBeats; chip fill follows wall clock at BPM"
  preview: "User → click circle wedge/chip or grid cell → play-midi overlays the triad onto the live engine clock; keyboard highlight does not depend on the sink"
  live: "User → laptop key or piano mouse down → note-on voice mixed per chunk until note-off; not a quantized play-midi one-shot"
  beats: "Every measure/pass (drums optional) → one spec on the engine sample clock"

related_features:
  - song_structure (Song as source)
  - song_library (title/New/Save/Open on transport left)
  - chord_slots (slot duration, audition)
  - row_repeats (timeline repeatPass)
  - piano_keyboard (soundingNotes highlight)
  - laptop_keys (freeform note-on/note-off)
  - guitar_tab (playing triad)
  - instruments (timbre)
  - audio_device (PipeWire output)
  - beats (per-measure patterns share timeline and transport)

core_components:
  - play-notes.py
  - play-notes.py --engine
  - samples/piano
  - samples/epiano
  - samples/organ

notes: "Transport left cluster is title/New/Save/Open; right is play/Loop/Beats/BPM. Loop defaults on. No tap tempo. Space is play/stop when laptop map is off and the beat editor is closed, not sustain. Slot fill uses wall-clock BPM. Playhead is wall-clock from engine started; play prerender can exceed 2s at low BPM so the overlay waits 30s for started and fails immediately on ok:false; PipeWire is not in CI; no per-bar execDetached."
