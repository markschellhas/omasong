feature_name: playback
purpose: "Play, stop, and loop the song at BPM; audition a slot; drive playhead and sounding-note highlight."

entry_points:
  - Transport.qml
  - Songwriter.qml
  - js/Song.js

apps:
  - songwriter

user_flow:
  primary: "User → Play or Space → walk buildTimeline events"
  section: "User → section Play → buildSectionTimeline for that section only"
  loop: "User → Loop toggle → wrap currentBeat"
  bpm: "User → BPM 40–240 → Song.setBpm"
  audition: "User → click filled slot → play chord for slotDurationBeats; chip fill follows wall clock at BPM"
  beats: "First event of each measure/pass → launch one frozen chord-and-drum measure render at song BPM"

related_features:
  - song_structure (Song as source)
  - song_library (title/library on transport left)
  - chord_slots (slot duration, audition)
  - row_repeats (timeline repeatPass)
  - piano_keyboard (soundingNotes highlight)
  - guitar_tab (playing triad)
  - instruments (timbre)
  - audio_device (PipeWire output)
  - beats (per-measure patterns share timeline and transport)

core_components:
  - play-notes.py
  - samples/piano
  - samples/epiano
  - samples/organ

notes: "Transport left cluster is title/library; right is play/Loop/Beats/BPM. Loop defaults on. No tap tempo. Space is play/stop when laptop map is off and the beat editor is closed, not sustain. Slot fill uses wall-clock BPM. Overlay playhead is not in CI."
