feature_name: music_theory
purpose: "Name triads, diatonic sets, time signatures, and chord drag payloads for the rest of the plugin."

entry_points:
  - js/Model.js

apps:
  - songwriter

user_flow:
  primary: "Caller → diatonicTriads(index) → seven I–vii° triads sharing the relative-minor set"
  payload: "GUI → encodeChord / decodeChord → chord|<name>|<rootPc>|<qualityInt>"

related_features:
  - circle_of_fifths (12 stations, chips)
  - chord_slots (payload decode onto Song)
  - song_structure (timeSig.numerator = slots per bar)
  - playback (triad MIDI for synth)

core_components:
  - tests/js_tests.js
  - tests/run.py

notes: "Song chords are triads only: { rootPc, quality }. No typed chord-symbol parser. Overlay does not pick meters."
