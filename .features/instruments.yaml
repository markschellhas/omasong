feature_name: instruments
purpose: "Cycle synth timbre among Piano, Electric Piano, and Organ."

entry_points:
  - Piano.qml
  - Songwriter.qml
  - play-notes.py

apps:
  - songwriter

user_flow:
  primary: "User → SoundPicker chevrons or h/l in Keyboard region → cycleInstrument; persist with song prefs"

related_features:
  - piano_keyboard (SoundPicker UI)
  - playback (same timbre for play, audition, preview, live)
  - region_focus (h/l when Keyboard focused)
  - audio_device (PipeWire)

core_components:
  - tests/run.py
  - samples/piano
  - samples/epiano
  - samples/organ

notes: "Piano uses Salamander Grand Piano (CC BY 3.0). Electric Piano uses Greg Sullivan Wurlitzer EP200 (CC BY 3.0). Organ uses Orgue Eglise Full. Saved Pad/Strings indices clamp to Organ."
