feature_name: chord_slots
purpose: "Place, split, shrink, and clear chords in bar slots (4/4 holds at most four)."

entry_points:
  - SongStructure.qml
  - js/Song.js

apps:
  - songwriter

user_flow:
  primary: "User → drop chord on empty slot → placeChord fills it"
  split: "User → drop onto filled chord → halve span and insert on drop side"
  move: "User → drag filled chip → drop left/right of another chord → moveChord reorders"
  resize: "User → drag left/right edge → ghost border snaps to each beat unit live; mouseup calls resizeSlot which opens empty slots in freed units"
  clear: "User → hover × on filled chip or Delete/Backspace on selected slot → setChord null"

related_features:
  - circle_of_fifths (drag source: wedges, chips, parallel-mode grid)
  - song_structure (capacity from time signature)
  - playback (click auditions slot)
  - guitar_tab (selected slot)
  - music_theory (encode/decode payload)
  - beats (shares measure identity and layout width)

core_components:
  - tests/js_tests.js

notes: "No type-to-enter symbol. At max capacity a further drop replaces."
