feature_name: song_structure
purpose: "Hold Verse/Chorus (and extra) sections with four bars by default; add rows of four, rename, or delete them."

entry_points:
  - SongStructure.qml
  - js/Song.js
  - Songwriter.qml

apps:
  - songwriter

user_flow:
  primary: "User → + Append Section → Verse/Chorus/…/Custom → addSection with four bars"
  play: "User → section Play → sectionPlayToggled → play that section only"
  extend: "User → Add 4 bars → addBars appends four empty measures"
  trim: "User → select empty bar → Delete/Backspace → removeMeasure (minimum four bars)"
  rename: "User → double-click title or More (…) → Rename → setSectionName"
  tab: "User → Tab or Shift+Tab while Song structure is highlighted → move selected cell across sections"
  error: "User → Delete last section → ignored"

related_features:
  - chord_slots (measures contain slots)
  - row_repeats (one flag per 4-bar row)
  - playback (timeline walks sections)
  - agent_api (sections in JSON)
  - music_theory (TimeSignature)
  - region_focus (Song region)

core_components:
  - tests/js_tests.js

notes: "Default song matches source Verse C|G|F|Dm Chorus D|G|C|Em. Cannot delete the last section. More menu is rename/delete only. Add/more menus parent to card menuOverlay (z 1000) above piano."
